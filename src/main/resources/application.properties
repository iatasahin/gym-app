# Application
spring.application.name=spring-gym-app

# Import additional property files
spring.config.import=classpath:hibernate.properties,classpath:flyway.properties,classpath:jwt.properties

# Brute Force Protection
gymapp.security.brute-force.enabled=true
gymapp.security.brute-force.max-attempts=3
gymapp.security.brute-force.block-duration-minutes=5

# Token Cleanup Scheduler
gymapp.security.cleanup.enabled=true
gymapp.security.cleanup.cron=0 0 3 * * ?

# Server
server.port=8080
management.server.port=8081

# ActiveMQ Artemis
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# HikariCP
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=GymAppHikariPool
spring.datasource.hikari.auto-commit=false

# Logging
logging.level.dev.ilkersahin=INFO

# Actuator exposure
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Health Probes (Kubernetes-style liveness/readiness)
management.endpoint.health.probes.enabled=true

# Liveness - lightweight, no DB calls (is the app process alive?)
management.endpoint.health.group.liveness.include=ping,livenessState
management.endpoint.health.group.liveness.show-details=never

# Readiness - DB-dependent checks (is the app ready for traffic?)
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace,flywayMigration,trainingType,usernameCounter
management.endpoint.health.group.readiness.show-details=always

# Tag application name
management.metrics.tags.application=${spring.application.name}
management.metrics.enable.jvm=true
management.metrics.enable.hikaricp=true

# Enable HTTP request metrics
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.autotime.percentiles=0.5,0.95,0.99
management.metrics.web.server.request.autotime.histogram=true
