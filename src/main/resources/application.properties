configapp.name=spring-gym-app
gymapp.file.storage.path=file:./gym-external-data.xml
gymapp.username.suffix.max-retries=1000

# Database Configuration
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/gymappDatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.username=gymapp_user
db.password=gymapp_password

# HikariCP Connection Pool
db.pool.minIdle=5
db.pool.maxPoolSize=20
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000

# Hibernate Properties
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.use_sql_comments=true
hibernate.hbm2ddl.auto=validate
hibernate.jdbc.batch_size=20
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.jdbc.fetch_size=50

# Flyway
flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true
flyway.validate-on-migrate=true
