# Database
spring.datasource.url=jdbc:mysql://gymapp-mysql:3306/gymappDatabase?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=gymapp_user
spring.datasource.password=gymapp_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka Client
eureka.client.service-url.defaultZone=http://gymapp-eureka:8761/eureka

# ActiveMQ Artemis
spring.artemis.broker-url=tcp://gymapp-artemis:61616

# Logging
logging.level.dev.ilkersahin=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=true

# Actuator (fully open)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
