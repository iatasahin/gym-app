# Service URLs (Docker Compose)
services.gym.base-url=http://localhost:8080
services.workload.base-url=http://localhost:8082

# Gym MySQL connection (for cleanup)
services.gym.db.url=jdbc:mysql://localhost:3306/gymappDatabase
services.gym.db.username=root
services.gym.db.password=rootPassword

# Workload MongoDB connection (for cleanup)
services.workload.mongo.uri=mongodb://gymapp_user:gymapp_password@localhost:27017
services.workload.mongo.database=test

# Timeouts for async operations (message processing)
e2e.async.timeout-seconds=10
e2e.async.poll-interval-ms=500
