services:
  db:
    image: mysql:9.5
    container_name: gymapp-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootPassword
      - MYSQL_DATABASE=gymappDatabase
      - MYSQL_USER=gymapp_user
      - MYSQL_PASSWORD=gymapp_password
      - TZ=UTC
    volumes:
      - ~/code/db/mysql/gymapp:/var/lib/mysql
    networks:
      - gymapp-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gymapp-prometheus
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gymapp-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gymapp-grafana
    profiles: [monitoring]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gymapp-network

  artemis:
    image: apache/activemq-artemis:2.44.0
    container_name: gymapp-artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      - ARTEMIS_USER=artemis
      - ARTEMIS_PASSWORD=artemis
    networks:
      - gymapp-network

  workload-app:
    image: iasw/spring-gym-workload:latest
    container_name: gymapp-workload
    profiles: [apps]
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - artemis
    restart: on-failure
    ports:
      - "8082:8082"
    networks:
      - gymapp-network

  main-app:
    image: iasw/spring-gym:latest
    container_name: gymapp-main
    profiles: [apps]
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - db
      - artemis
    restart: on-failure
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - gymapp-network


volumes:
  grafana-data:

networks:
  gymapp-network:
    name: gymapp-network
    driver: bridge
