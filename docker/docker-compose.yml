services:
  db:
    image: mysql:9.5
    container_name: gymappMySqlContainer
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootPassword
      - MYSQL_DATABASE=gymappDatabase
      - MYSQL_USER=gymapp_user
      - MYSQL_PASSWORD=gymapp_password
      - TZ=UTC
    volumes:
      - ~/code/db/mysql/gymapp:/var/lib/mysql
    networks:
      - gymapp-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gymapp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - gymapp-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gymapp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gymapp-network

  main-app:
    image: iasw/spring-gym:latest
    depends_on:
      - db
    restart: on-failure
    ports:
      - "8080:8080"


volumes:
  grafana-data:

networks:
  gymapp-network:
    name: gymapp-network
    driver: bridge
